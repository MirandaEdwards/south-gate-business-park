name: Debug Large Southgate FTP Upload

on:
  workflow_dispatch:

jobs:
  debug-large-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TERANORTH_FTP_SERVER: ${{ secrets.TERANORTH_FTP_SERVER }}
      TERANORTH_FTP_PORT: ${{ secrets.TERANORTH_FTP_PORT }}
      TERANORTH_FTP_USERNAME: ${{ secrets.TERANORTH_FTP_USERNAME }}
      TERANORTH_FTP_PASSWORD: ${{ secrets.TERANORTH_FTP_PASSWORD }}
      TERANORTH_FTP_REMOTE_PATH: ${{ secrets.TERANORTH_FTP_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

      - name: Inspect test file
        shell: bash
        run: |
          set -euo pipefail

          TEST_FILE="Community Board.png"

          if [ ! -f "$TEST_FILE" ]; then
            echo "Cannot find: $TEST_FILE"
            exit 1
          fi

          echo "Testing file:"
          ls -lh "$TEST_FILE"

          echo
          echo "Exact size:"
          stat --printf="%n: %s bytes\n" "$TEST_FILE"

      - name: Upload large file as new file
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF

          debug 6

          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false

          set net:max-retries 3
          set net:timeout 60
          set net:reconnect-interval-base 5

          # Allow up to 10 minutes without transfer progress.
          set xfer:timeout 10m

          set cmd:fail-exit true

          cd "${TERANORTH_FTP_REMOTE_PATH}"

          echo "===== LARGE NEW-FILE UPLOAD ====="

          put "Community Board.png" \
              -o "github-large-upload-test.png"

          echo "===== LARGE NEW-FILE UPLOAD SUCCEEDED ====="

          bye
          EOF

      - name: Inspect uploaded file
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF

          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set cmd:fail-exit true

          cd "${TERANORTH_FTP_REMOTE_PATH}"

          echo "Remote file after first upload:"
          cls -l "github-large-upload-test.png"

          bye
          EOF

      - name: Test overwrite of large file
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF

          debug 6

          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false

          set net:max-retries 3
          set net:timeout 60
          set net:reconnect-interval-base 5
          set xfer:timeout 10m
          set cmd:fail-exit true

          cd "${TERANORTH_FTP_REMOTE_PATH}"

          echo "===== LARGE OVERWRITE TEST ====="

          put "Community Board.png" \
              -o "github-large-upload-test.png"

          echo "===== LARGE OVERWRITE SUCCEEDED ====="

          bye
          EOF