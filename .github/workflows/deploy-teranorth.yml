name: Deploy Southgate to Teranorth FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TERANORTH_FTP_SERVER: ${{ secrets.TERANORTH_FTP_SERVER }}
      TERANORTH_FTP_PORT: ${{ secrets.TERANORTH_FTP_PORT }}
      TERANORTH_FTP_USERNAME: ${{ secrets.TERANORTH_FTP_USERNAME }}
      TERANORTH_FTP_PASSWORD: ${{ secrets.TERANORTH_FTP_PASSWORD }}
      TERANORTH_FTP_REMOTE_PATH: ${{ secrets.TERANORTH_FTP_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate settings
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TERANORTH_FTP_SERVER:-}" ]; then
            echo "TERANORTH_FTP_SERVER is missing."
            exit 1
          fi

          if [ -z "${TERANORTH_FTP_USERNAME:-}" ]; then
            echo "TERANORTH_FTP_USERNAME is missing."
            exit 1
          fi

          if [ -z "${TERANORTH_FTP_PASSWORD:-}" ]; then
            echo "TERANORTH_FTP_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${TERANORTH_FTP_REMOTE_PATH:-}" ]; then
            echo "TERANORTH_FTP_REMOTE_PATH is missing."
            exit 1
          fi

          REMOTE_PATH="${TERANORTH_FTP_REMOTE_PATH%/}"

          case "$REMOTE_PATH" in
            */southgate|southgate)
              echo "Southgate destination validated."
              ;;
            *)
              echo "ERROR: FTP destination must end with /southgate."
              exit 1
              ;;
          esac

      - name: Install FTP tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp netcat-openbsd >/dev/null

      - name: Test FTP control connection
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          echo "Resolving FTP server..."
          getent hosts "$TERANORTH_FTP_SERVER"

          echo
          echo "Testing TCP port ${FTP_PORT}..."
          nc -vz -w 15 "$TERANORTH_FTP_SERVER" "$FTP_PORT"

          echo
          echo "FTP control port is reachable."

      - name: Test FTP login and passive data connection
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false

          set net:max-retries 2
          set net:timeout 30
          set net:reconnect-interval-base 5
          set xfer:timeout 60
          set cmd:fail-exit true

          echo "FTP login successful."

          cd "${TERANORTH_FTP_REMOTE_PATH}"

          echo "Southgate directory accessible."

          pwd

          echo "Testing passive FTP data connection with directory listing..."
          cls -1

          echo "Passive FTP data connection successful."

          bye
          EOF

      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR="${RUNNER_TEMP}/southgate-deploy"

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README*' \
            --exclude='*.md' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            ./ "$DEPLOY_DIR/"

          if [ -z "$(find "$DEPLOY_DIR" -mindepth 1 -print -quit)" ]; then
            echo "No website files were found."
            exit 1
          fi

          echo "Website files prepared:"
          find "$DEPLOY_DIR" -type f | sort

          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Upload website to Southgate
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF
          set ftp:ssl-allow false

          # Use passive FTP, but prefer traditional PASV over EPSV.
          set ftp:passive-mode true
          set ftp:prefer-epsv false

          # Keep transfers sequential while troubleshooting the firewall.
          set mirror:parallel-transfer-count 1
          set mirror:parallel-directories false

          # Don't attempt to reproduce Unix permissions on the web server.
          set mirror:set-permissions false

          # Give individual data connections a little more tolerance.
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          set xfer:timeout 120
          set cmd:fail-exit true

          cd "${TERANORTH_FTP_REMOTE_PATH}"
          lcd "${DEPLOY_DIR}"

          echo "Beginning Southgate upload..."

          mirror \
            --reverse \
            --verbose \
            --parallel=1 \
            --no-empty-dirs \
            . .

          echo "Upload completed."

          bye
          EOF

      - name: Verify remote site
        shell: bash
        run: |
          set -euo pipefail

          FTP_PORT="${TERANORTH_FTP_PORT:-21}"

          lftp \
            -u "${TERANORTH_FTP_USERNAME},${TERANORTH_FTP_PASSWORD}" \
            "ftp://${TERANORTH_FTP_SERVER}:${FTP_PORT}" <<EOF
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 2
          set net:timeout 30
          set cmd:fail-exit true

          cd "${TERANORTH_FTP_REMOTE_PATH}"

          echo "Remote Southgate directory after deployment:"
          cls -1

          bye
          EOF

      - name: Deployment complete
        shell: bash
        run: |
          echo "Southgate FTP deployment completed successfully."